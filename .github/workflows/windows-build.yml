# Compilation réelle sous Windows (MSVC), tests CPU (ctest) et selftest en D3D11 WARP (rendu logiciel,
# le runner n'a pas de GPU). Aucun secret, aucun SDK NVIDIA : build par défaut (RPENHANCE_NVVFX=OFF).
name: windows-build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configuration CMake (x64, RPENHANCE_NVVFX=OFF)
        run: cmake -S . -B build -A x64 -DRPENHANCE_NVVFX=OFF

      - name: Compilation Release
        run: cmake --build build --config Release --parallel

      # Logique pure seulement : aucune carte de capture ni périphérique audio n'est ouvert dans la CI.
      - name: Tests CPU (ctest dedupe, scene_cut, tap_protocol, capture_logic, audio_delay, audio_sync, enhance)
        working-directory: build
        run: ctest -C Release --output-on-failure

      # WARP peut ne pas tout supporter : l'étape ne bloque pas le job pour l'instant, mais ses journaux et
      # images sont publiés en artefact. rpenhance est une appli WIN32 (pas de console) : on attend le
      # processus et on relaie son code de sortie.
      - name: Selftest D3D11 WARP
        id: selftest
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $exe = Join-Path $PWD 'build\Release\rpenhance.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest', '--warp' -PassThru
          $null = $p.Handle  # garde le handle pour lire ExitCode après WaitForExit
          if (-not $p.WaitForExit(15 * 60 * 1000)) {
            $p.Kill()
            Write-Error 'selftest WARP : délai de 15 min dépassé'
            exit 124
          }
          $log = 'build\Release\rpenhance.log'
          if (Test-Path $log) { Get-Content -Encoding UTF8 $log }
          Write-Host "code de sortie : $($p.ExitCode)"
          exit $p.ExitCode

      - name: Résumé du selftest
        if: always()
        run: |
          $log = 'build\Release\rpenhance.log'
          $out = @('## Selftest D3D11 WARP', '')
          $out += "Résultat de l'étape : **${{ steps.selftest.outcome }}** (non bloquant pour l'instant)"
          $out += ''
          if (Test-Path $log) {
            $lines = Get-Content -Encoding UTF8 $log |
              Where-Object { $_ -match 'PSNR|dB|SELFTEST|Device D3D11|GPU :|Upscale|Amélioration|fonctionnalité|Erreur|HRESULT' }
            if ($lines) {
              $out += '```'
              $out += $lines
              $out += '```'
            } else {
              $out += "_Aucune ligne de mesure dans rpenhance.log._"
            }
          } else {
            $out += '_rpenhance.log absent (le selftest ne s''est pas lancé ?)._'
          }
          $out += ''
          $out += 'WARP = rasteriseur logiciel : les PSNR valent pour la qualité, les temps GPU ne veulent rien dire.'
          $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # Vrai test (bloquant) : tap_writer émet des frames NV12 ou BGRA dans une mémoire partagée au format frame
      # tap v2 de SmoovPlay (deux sessions, avec arrêt puis redémarrage), rpenhance --selftest-tap --warp les lit,
      # les convertit en BGRA et vérifie numéro de frame, couleurs, drapeaux et sessions. Le lecteur démarre en
      # premier ; l'émetteur attend son heartbeat. Chaque cas a son propre nom de mémoire partagée.
      - name: Frame tap (tap_writer + selftest-tap WARP)
        timeout-minutes: 10
        run: |
          $bin    = Join-Path $PWD 'build\Release'
          $exe    = Join-Path $bin 'rpenhance.exe'
          $writer = Join-Path $bin 'tap_writer.exe'
          $logs   = Join-Path $PWD 'tap-logs'
          New-Item -ItemType Directory -Force $logs | Out-Null
          $mainlog = Join-Path $bin 'rpenhance.log'
          # rpenhance.log est réécrit à chaque lancement : on garde celui du selftest WARP.
          if (Test-Path $mainlog) { Copy-Item $mainlog (Join-Path $logs 'selftest-warp.log') }
          $cases = @(
            @{ name = 'nv12-720p';      args = @('--format', 'nv12', '--width', '1280', '--height', '720') },
            @{ name = 'nv12-480p-bt601'; args = @('--format', 'nv12', '--width', '854', '--height', '480') },
            @{ name = 'bgra-720p';      args = @('--format', 'bgra', '--width', '1280', '--height', '720') }
          )
          $failed = @()
          $summary = @('## Frame tap (selftest-tap, WARP)', '')
          foreach ($c in $cases) {
            $tap = "Local\rpenhance-ci-$($c.name)"
            Write-Host "=== $($c.name) : $tap ==="
            $reader = Start-Process -FilePath $exe -ArgumentList @('--selftest-tap', '--warp', '--tap-name', $tap) -PassThru
            $null = $reader.Handle  # garde le handle pour lire ExitCode après WaitForExit
            $wargs = $c.args + @('--name', $tap, '--frames', '120', '--sessions', '2', '--wait-reader', '60')
            $w = Start-Process -FilePath $writer -ArgumentList $wargs -PassThru -NoNewWindow `
              -RedirectStandardOutput (Join-Path $logs "writer-$($c.name).txt") `
              -RedirectStandardError (Join-Path $logs "writer-$($c.name).err.txt")
            $null = $w.Handle
            $rcode = 0
            if (-not $reader.WaitForExit(150 * 1000)) { $reader.Kill(); $rcode = 124; Write-Host 'selftest-tap : délai dépassé' }
            else { $rcode = $reader.ExitCode }
            $wcode = 0
            if (-not $w.WaitForExit(30 * 1000)) { $w.Kill(); $wcode = 124; Write-Host 'tap_writer : délai dépassé' }
            else { $wcode = $w.ExitCode }
            $caselog = Join-Path $logs "selftest-tap-$($c.name).log"
            if (Test-Path $mainlog) { Copy-Item $mainlog $caselog; Get-Content -Encoding UTF8 $caselog }
            Get-Content (Join-Path $logs "writer-$($c.name).txt"), (Join-Path $logs "writer-$($c.name).err.txt") -ErrorAction SilentlyContinue
            Write-Host "selftest-tap : $rcode ; tap_writer : $wcode"
            $summary += "- **$($c.name)** : selftest-tap $rcode, tap_writer $wcode"
            if (Test-Path $caselog) {
              $summary += (Get-Content -Encoding UTF8 $caselog |
                Where-Object { $_ -match 'Session \d|Lecteur :|SELFTEST TAP|ÉCHEC|Erreur|HRESULT' } |
                ForEach-Object { "  - ``$_``" })
            }
            if ($rcode -ne 0 -or $wcode -ne 0) { $failed += $c.name }
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if ($failed.Count -gt 0) {
            Write-Error "frame tap en échec : $($failed -join ', ')"
            exit 1
          }

      - name: Artefacts du selftest (journal, images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-warp
          path: |
            build/Release/rpenhance.log
            build/Release/selftest/
            build/Testing/Temporary/LastTest.log
            tap-logs/
          if-no-files-found: warn
          retention-days: 7
